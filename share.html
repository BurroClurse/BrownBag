<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Which servers this page may contact, and which scripts may run (tests/csp.test.mjs). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-ESLifGE1d31XFw4IRDCb1D0kNwXpgTkYxOtzZWKdcgU='; style-src 'self'; img-src 'self' data:; connect-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Shared medicine list | Brown Bag</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#6b3f1d">
  <link rel="stylesheet" href="css/brownbag.css">
  <script>
    // A slow connection can lose one of the files below. Then this page
    // tries once more by itself, and after that says what to do. The app
    // sets brownBagStarted as its first step.
    window.addEventListener("error", function (event) {
      var file = event.target && event.target.tagName === "SCRIPT";
      if (window.brownBagStarted || (!file && !(event instanceof ErrorEvent))) return;
      try {
        if (!sessionStorage.getItem("brownbag:retried")) {
          sessionStorage.setItem("brownbag:retried", "yes");
          location.reload();
          return;
        }
        sessionStorage.removeItem("brownbag:retried");
      } catch (error) {
        // No session storage: say what to do instead of trying forever.
      }
      document.addEventListener("DOMContentLoaded", say);
      if (document.readyState !== "loading") say();
      function say() {
        var main = document.querySelector("main");
        main.textContent = "Part of Brown Bag didn't arrive. Check your connection, then open it again.";
      }
    }, true);
  </script>
  <script type="module" src="js/share-view.js"></script>
</head>
<body>
  <main id="share">
    <p>Opening the shared list…</p>
  </main>
  <noscript><p>This page needs JavaScript turned on to open the list.</p></noscript>
</body>
</html>
