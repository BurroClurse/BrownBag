<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brown Bag logo source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=block" rel="stylesheet">
<!--
  Source for the Brown Bag logo and app icon, drawn to match Tyler's
  sketch (Nov 21). tools/logo/render.mjs opens this page in headless Chrome
  and saves PNGs: ?mode=logo (bag with the name) and ?mode=icon (bag with
  two pills, no text).
  Colors: kraft #C8925E, side #A97548, shade #B37E50, outline #6B3A1F,
  name and pill outline #164F5A, pill mint #93C8B9.
-->
<style>
  html, body { margin: 0; background: transparent; }
  .canvas { width: 1024px; height: 1024px; position: relative; }
  .canvas.icon { background: #FFFFFF; }
  svg.art { position: absolute; inset: 0; }
  .name {
    /* The name sits in front of the bag, centered, with no outline. */
    position: absolute; left: 0; right: 0; top: 404px;
    text-align: center;
    font-family: "Fredoka", sans-serif; font-weight: 700;
    font-size: 200px; line-height: 0.8; color: #164F5A;
  }
  .line { white-space: nowrap; }
  /* The real "w" keeps its own spacing but is drawn invisible; four pills
     are laid over its four strokes. The empty marker after it sits on the
     baseline, so the pills can be placed exactly. */
  #w { color: transparent; }
  #baseline { display: inline-block; width: 0; height: 0; }
</style>
</head>
<body>
<div id="canvas" class="canvas">
  <svg class="art" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <g id="bag" stroke="#6B3A1F" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <!-- side of the bag, with its fold line and the folded bottom corner -->
      <path d="M323 233 L351 292 L366 800 L264 744 L272 640 Z" fill="#A97548"/>
      <path d="M323 233 L332 709" fill="none" stroke-width="5"/>
      <path d="M264 744 L332 709 L366 800 Z" fill="#B37E50"/>
      <!-- front -->
      <path d="M351 292 L648 295 L692 708 Q695 723 680 726 L366 800 Z" fill="#C8925E"/>
      <!-- shading under the fold -->
      <path d="M353 297 L649 300 L651 320 L354 320 Z" fill="#B37E50" stroke="none"/>
      <!-- folded top -->
      <path d="M323 230 L630 222 Q638 222 641 229 L667 276 Q671 287 660 289 L351 292 Z" fill="#C8925E"/>
    </g>
    <g id="pills"></g>
  </svg>
  <div class="name" id="name">
    <div class="line">Bro<span id="w">w</span><span id="baseline"></span>n</div>
    <div class="line">Bag</div>
  </div>
</div>
<script>
  var NS = "http://www.w3.org/2000/svg";
  var mode = new URLSearchParams(location.search).get("mode") || "logo";

  function el(tag, attrs, parent) {
    var node = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(node);
    return node;
  }

  // One capsule from end (x1,y1) to end (x2,y2), rounded ends included:
  // white half first, mint half second, a soft shine on the mint half, and
  // a thin dark teal outline and seam, like the sketch.
  var clips = 0;
  function capsule(parent, x1, y1, x2, y2, width) {
    var length = Math.hypot(x2 - x1, y2 - y1);
    var angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    var r = width / 2;
    var g = el("g", { transform: "translate(" + x1 + " " + y1 + ") rotate(" + angle + ")" }, parent);
    var id = "pill" + (clips += 1);
    var clip = el("clipPath", { id: id }, g);
    el("rect", { x: 0, y: -r, width: length, height: width, rx: r }, clip);
    var inside = el("g", { "clip-path": "url(#" + id + ")" }, g);
    el("rect", { x: 0, y: -r, width: length / 2, height: width, fill: "#FFFFFF" }, inside);
    el("rect", { x: length / 2, y: -r, width: length / 2, height: width, fill: "#93C8B9" }, inside);
    el("path", {
      d: "M" + (length * 0.6) + " " + (-r * 0.45) + " L" + (length - r * 1.0) + " " + (-r * 0.45),
      stroke: "#FFFFFF", "stroke-width": width * 0.11, "stroke-linecap": "round", opacity: 0.7
    }, inside);
    el("line", { x1: length / 2, y1: -r, x2: length / 2, y2: r, stroke: "#164F5A", "stroke-width": width * 0.08 }, g);
    el("rect", { x: 0, y: -r, width: length, height: width, rx: r, fill: "none", stroke: "#164F5A", "stroke-width": width * 0.09 }, g);
  }

  if (mode === "logo") {
    document.fonts.ready.then(function () {
      var name = document.getElementById("name");
      var size = parseFloat(getComputedStyle(name).fontSize);
      var ctx = document.createElement("canvas").getContext("2d");
      ctx.font = "700 " + size + "px Fredoka";
      var w = ctx.measureText("w");
      var box = document.getElementById("canvas").getBoundingClientRect();
      var span = document.getElementById("w").getBoundingClientRect();
      var baseline = document.getElementById("baseline").getBoundingClientRect().bottom - box.top;
      // The invisible w's ink: left and right edges, top and bottom.
      var inkLeft = span.left - box.left - w.actualBoundingBoxLeft;
      var inkRight = span.left - box.left + w.actualBoundingBoxRight;
      var yTop = baseline - w.actualBoundingBoxAscent;
      var yBottom = baseline + w.actualBoundingBoxDescent;
      // Four pills of the same size on the four strokes of the w.
      var t = size * 0.115;
      var left = inkLeft + t * 0.5;
      var right = inkRight - t * 0.5;
      var step = (right - left) / 4;
      var xs = [left, left + step, left + step * 2, left + step * 3, right];
      var pills = document.getElementById("pills");
      capsule(pills, xs[0], yTop, xs[1], yBottom, t);
      capsule(pills, xs[2], yTop, xs[1], yBottom, t);
      capsule(pills, xs[2], yTop, xs[3], yBottom, t);
      capsule(pills, xs[4], yTop, xs[3], yBottom, t);
      document.body.dataset.ready = "yes";
    });
  } else {
    document.getElementById("name").remove();
    document.getElementById("canvas").classList.add("icon");
    // Bag centered in the icon; two pills centered on the bag's front, as in
    // the sketch: one tilted, white end low and left, and one lying flat in
    // front of it.
    // The bag is scaled up to fill the icon, around its own middle.
    var fit = "translate(512 512) scale(1.4) translate(-480 -511)";
    document.getElementById("bag").setAttribute("transform", fit);
    var pills = document.getElementById("pills");
    pills.setAttribute("transform", fit);
    var cx = 510, cy = 567;
    capsule(pills, cx - 85, cy + 5, cx + 25, cy - 95, 56);
    capsule(pills, cx - 52, cy + 26, cx + 103, cy + 26, 56);
  }
</script>
</body>
</html>
