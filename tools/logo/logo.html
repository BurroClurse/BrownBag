<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brown Bag logo source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=block" rel="stylesheet">
<!--
  Source for the Brown Bag logo and app icon, drawn to match Tyler's
  sketch (Nov 21). tools/logo/render.mjs opens this page in headless Chrome
  and saves PNGs: ?mode=logo (bag with the name) and ?mode=icon (bag with
  two pills, no text).
  Colors: kraft #C8925E, side #A97548, shade #B37E50, outline #6B3A1F,
  name and pill outline #164F5A, pill mint #164F5A.
-->
<style>
  html, body { margin: 0; background: transparent; }
  .canvas { width: 1024px; height: 1024px; position: relative; }
  .canvas.icon { background: #FFFFFF; }
  svg.art { position: absolute; inset: 0; }
  .name {
    /* The name sits in front of the bag, centered, with no outline. */
    position: absolute; left: 0; right: 0; top: 344px;
    text-align: center;
    font-family: "Fredoka", sans-serif; font-weight: 700;
    font-size: 200px; line-height: 0.8; color: #164F5A;
  }
  .line { white-space: nowrap; }
  /* The real "w" keeps its normal spacing but is invisible. Its strokes are
     traced from the font and a pill is laid on each one. The empty marker
     after it sits on the baseline. */
  #w { color: transparent; }
  #baseline { display: inline-block; width: 0; height: 0; }
</style>
</head>
<body>
<div id="canvas" class="canvas">
  <svg class="art" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <g id="bag" stroke="#6B3A1F" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <!-- side of the bag, with its fold line and the folded bottom corner -->
      <path d="M323 233 L351 292 L366 800 L264 744 L272 640 Z" fill="#A97548"/>
      <path d="M323 233 L332 709" fill="none" stroke-width="5"/>
      <path d="M264 744 L332 709 L366 800 Z" fill="#B37E50"/>
      <!-- front -->
      <path d="M351 292 L648 295 L692 708 Q695 723 680 726 L366 800 Z" fill="#C8925E"/>
      <!-- shading under the fold -->
      <path d="M353 297 L649 300 L651 320 L354 320 Z" fill="#B37E50" stroke="none"/>
      <!-- folded top -->
      <path d="M323 230 L630 222 Q638 222 641 229 L667 276 Q671 287 660 289 L351 292 Z" fill="#C8925E"/>
    </g>
    <g id="pills"></g>
  </svg>
  <div class="name" id="name">
    <div class="line">Bro<span id="w">w</span><span id="baseline"></span>n</div>
    <div class="line">Bag</div>
  </div>
</div>
<script>
  var NS = "http://www.w3.org/2000/svg";
  var mode = new URLSearchParams(location.search).get("mode") || "logo";

  function el(tag, attrs, parent) {
    var node = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(node);
    return node;
  }

  // One capsule from end (x1,y1) to end (x2,y2), rounded ends included:
  // white half first, mint half second, a soft shine on the mint half, and
  // a thin dark teal outline and seam, like the sketch.
  var clips = 0;
  function capsule(parent, x1, y1, x2, y2, width) {
    var length = Math.hypot(x2 - x1, y2 - y1);
    var angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    var r = width / 2;
    var g = el("g", { transform: "translate(" + x1 + " " + y1 + ") rotate(" + angle + ")" }, parent);
    var id = "pill" + (clips += 1);
    var clip = el("clipPath", { id: id }, g);
    el("rect", { x: 0, y: -r, width: length, height: width, rx: r }, clip);
    var inside = el("g", { "clip-path": "url(#" + id + ")" }, g);
    el("rect", { x: 0, y: -r, width: length / 2, height: width, fill: "#FFFFFF" }, inside);
    el("rect", { x: length / 2, y: -r, width: length / 2, height: width, fill: "#2B6E76" }, inside);
    el("path", {
      d: "M" + (length * 0.6) + " " + (-r * 0.45) + " L" + (length - r * 1.0) + " " + (-r * 0.45),
      stroke: "#FFFFFF", "stroke-width": width * 0.11, "stroke-linecap": "round", opacity: 0.7
    }, inside);
    el("line", { x1: length / 2, y1: -r, x2: length / 2, y2: r, stroke: "#164F5A", "stroke-width": width * 0.08 }, g);
    el("rect", { x: 0, y: -r, width: length, height: width, rx: r, fill: "none", stroke: "#164F5A", "stroke-width": width * 0.09 }, g);
  }

  // A pill given by the centers of its two rounded ends.
  function pillBetween(parent, cx1, cy1, cx2, cy2, width) {
    var d = Math.hypot(cx2 - cx1, cy2 - cy1), r = width / 2;
    var ux = (cx2 - cx1) / d, uy = (cy2 - cy1) / d;
    capsule(parent, cx1 - ux * r, cy1 - uy * r, cx2 + ux * r, cy2 + uy * r, width);
  }

  // The same shape as the app icon's pills: 2.7 times as long as wide.
  var PILL_RATIO = 2.7;

  // Traces the four strokes of the font's "w": draws it on a hidden canvas,
  // finds where each stroke is near the top and near the bottom, and
  // extends those lines to the letter's top and bottom. Coordinates are
  // relative to the letter's origin on the baseline.
  function traceW(font, size) {
    var pad = Math.round(size * 0.3);
    var c = document.createElement("canvas");
    c.width = Math.round(size * 1.6); c.height = Math.round(size * 1.6);
    var ctx = c.getContext("2d");
    ctx.font = font; ctx.fillStyle = "#000";
    var base = Math.round(size * 1.1);
    ctx.fillText("w", pad, base);
    var data = ctx.getImageData(0, 0, c.width, c.height).data;
    function ink(x, y) { return data[(y * c.width + x) * 4 + 3] > 128; }
    function runs(y) {
      var out = [], start = -1;
      for (var x = 0; x <= c.width; x += 1) {
        var on = x < c.width && ink(x, y);
        if (on && start < 0) start = x;
        if (!on && start >= 0) { out.push([start, x - 1]); start = -1; }
      }
      return out;
    }
    var minY = c.height, maxY = 0;
    for (var y = 0; y < c.height; y += 1) {
      if (runs(y).length) { minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
    }
    // This font's w is heavy: its middle strokes merge into one peak. Its
    // five points are clear, though: three tops (left, middle, right), read
    // just under the top edge, and two bottoms, read on the bottom edge.
    var h = maxY - minY;
    var mid = function (run) { return (run[0] + run[1]) / 2; };
    var topRow = runs(Math.round(minY + h * 0.08));
    var bottomRow = runs(maxY);
    var tops = [mid(topRow[0]), mid(topRow[1]), mid(topRow[topRow.length - 1])];
    var bottoms = [mid(bottomRow[0]), mid(bottomRow[bottomRow.length - 1])];
    // Pills a third of the letter's height thick, so the gaps between the
    // strokes show. Each pill is given by the centers of its rounded ends:
    // a top end just inside the top edge and a bottom end just inside the
    // bottom edge, on the stroke's line. Pills that meet share an end
    // center, so they join like the letter's own strokes.
    var thick = h / 3.1, r = thick / 2;
    // Spread the strokes out from the letter's middle so each V shows; the
    // letter gets the extra room on each side.
    var SPREAD = 1.42;
    var center = tops[1];
    function spread(x) { return center + (x - center) * SPREAD; }
    tops = tops.map(spread);
    bottoms = bottoms.map(spread);
    var extra = (tops[2] - tops[0]) * (1 - 1 / SPREAD);
    function at(xTop, xBottom, y) { return xTop + (xBottom - xTop) * (y - minY) / h; }
    function stroke(xTop, xBottom) {
      var y1 = minY + r, y2 = maxY - r;
      return [at(xTop, xBottom, y1) - pad, y1 - base, at(xTop, xBottom, y2) - pad, y2 - base];
    }
    return {
      width: thick,
      extra: extra,
      strokes: [
        stroke(tops[0], bottoms[0]),
        stroke(tops[2], bottoms[1]),
        stroke(tops[1], bottoms[0]),
        stroke(tops[1], bottoms[1])
      ]
    };
  }

  if (mode === "logo") {
    document.fonts.ready.then(function () {
      var name = document.getElementById("name");
      var size = parseFloat(getComputedStyle(name).fontSize);
      var w = traceW("700 " + size + "px Fredoka", size);
      var letter = document.getElementById("w");
      letter.style.margin = "0 " + (w.extra / 2) + "px";
      var box = document.getElementById("canvas").getBoundingClientRect();
      var originX = document.getElementById("w").getBoundingClientRect().left - box.left;
      var baseline = document.getElementById("baseline").getBoundingClientRect().bottom - box.top;
      var t = w.width;
      document.body.dataset.trace = JSON.stringify(w);
      var pills = document.getElementById("pills");
      w.strokes.forEach(function (s) {
        pillBetween(pills, originX + s[0], baseline + s[1], originX + s[2], baseline + s[3], t);
      });
      document.body.dataset.ready = "yes";
    });
  } else {
    document.getElementById("name").remove();
    document.getElementById("canvas").classList.add("icon");
    // Bag centered in the icon; two pills centered on the bag's front, as in
    // the sketch: one tilted, white end low and left, and one lying flat in
    // front of it.
    // The bag is scaled up to fill the icon, around its own middle.
    var fit = "translate(512 512) scale(1.4) translate(-480 -511)";
    document.getElementById("bag").setAttribute("transform", fit);
    var pills = document.getElementById("pills");
    pills.setAttribute("transform", fit);
    var cx = 518, cy = 557;
    capsule(pills, cx - 85, cy + 5, cx + 25, cy - 95, 56);
    capsule(pills, cx - 52, cy + 26, cx + 103, cy + 26, 56);
  }
</script>
</body>
</html>
