<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Brown Bag</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#6b3f1d">
  <link rel="stylesheet" href="css/brownbag.css">
  <script>
    // A slow connection can lose one of the files below. Then this page
    // tries once more by itself, and after that says what to do. The app
    // sets brownBagStarted as its first step.
    window.addEventListener("error", function (event) {
      var file = event.target && event.target.tagName === "SCRIPT";
      if (window.brownBagStarted || (!file && !(event instanceof ErrorEvent))) return;
      try {
        if (!sessionStorage.getItem("brownbag:retried")) {
          sessionStorage.setItem("brownbag:retried", "yes");
          location.reload();
          return;
        }
        sessionStorage.removeItem("brownbag:retried");
      } catch (error) {
        // No session storage: say what to do instead of trying forever.
      }
      document.addEventListener("DOMContentLoaded", say);
      if (document.readyState !== "loading") say();
      function say() {
        var main = document.querySelector("main");
        main.textContent = "Part of Brown Bag didn't arrive. Check your connection, then open it again.";
      }
    }, true);
  </script>
  <script src="js/quiet.js"></script>
  <script src="vendor/fhir-client-3.0.1.js" integrity="sha384-KCMFUEhPpmBodyBFJ/fdPsY5TQrayEi08dDvK6gTHSvz4BVSRtn8fpbMBFg2nmCJ"></script>
</head>
<body>
  <main id="launch" class="screen-launch">
    <p>Loading Brown Bag…</p>
  </main>
  <noscript><p>Brown Bag needs JavaScript turned on.</p></noscript>
  <script>
    // js/launch.js shows the list of sources and calls this when the patient
    // chooses the sandbox, or right away for a link that names its server.
    function startSignIn() {
      // Patient standalone against the SMART Health IT R4 sandbox.
      // The sandbox reads the "/sim/..." segment and shows a patient login
      // because the launch type is patient-standalone (the 3 below).
      // A different iss on the query string wins, so the SMART Launcher can
      // still start this same page.
      var launchOptions = [
        3, "", "", "AUTO",
        0, 0, 0,
        "", "", "", "", "", "", "",
        0, 1, ""
      ];

      var sandboxIss = "https://launch.smarthealthit.org/v/r4/sim/"
        + btoa(JSON.stringify(launchOptions)).replace(/=+$/g, "").replace(/\+/g, "-").replace(/\//g, "_")
        + "/fhir";

      // authorize() answers with the sign-in page's address.
      return Promise.resolve().then(function () {
        return FHIR.oauth2.authorize({
          // Public client. The sandbox does not require a registered secret.
          clientId: "my_web_app",
          // launch/patient asks the sandbox to pick the patient during sign-in.
          // offline_access asks for a long-lasting pass (a refresh token), so
          // the next unlock updates the list without this sign-in page.
          scope: "launch/patient openid fhirUser offline_access patient/Patient.read patient/MedicationRequest.read patient/MedicationStatement.read patient/Medication.read patient/Practitioner.read patient/ExplanationOfBenefit.read patient/AllergyIntolerance.read",
          // Must be this app's index.html. fhir-client turns the relative URL
          // into the full GitHub Pages URL before sending it.
          redirectUri: "index.html",
          iss: sandboxIss,
          // js/launch.js goes there, unless the patient has moved on.
          noRedirect: true
        });
      });
    }
  </script>
  <script type="module" src="js/launch.js"></script>
</body>
</html>
